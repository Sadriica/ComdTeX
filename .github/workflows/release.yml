name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (lint, types, tests, Rust checks)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Cargo clippy (warnings as errors)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo fmt check
        working-directory: src-tauri
        run: cargo fmt -- --check

  build:
    needs: [verify]
    permissions:
      contents: write

    # The macOS leg is a beta (ad-hoc signed, never built on the maintainer's
    # machine): it may fail or time out without failing the build job, the
    # publish job or latest.json for Linux and Windows.
    continue-on-error: ${{ matrix.beta == true }}
    timeout-minutes: ${{ matrix.beta == true && 45 || 60 }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            beta: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version consistency
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          CARGO_VERSION=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          TAURI_VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")

          echo "Tag version:         $TAG_VERSION"
          echo "package.json:        $PKG_VERSION"
          echo "Cargo.toml:          $CARGO_VERSION"
          echo "tauri.conf.json:     $TAURI_VERSION"

          FAIL=0
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            FAIL=1
          fi
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::src-tauri/Cargo.toml version ($CARGO_VERSION) does not match tag ($TAG_VERSION)"
            FAIL=1
          fi
          if [ "$TAURI_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::src-tauri/tauri.conf.json version ($TAURI_VERSION) does not match tag ($TAG_VERSION)"
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Version mismatch detected. Bump all three files to $TAG_VERSION before tagging."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          if PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null); then
            echo "Previous tag: $PREV_TAG"
            COMMITS=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          else
            echo "No previous tag found; using full git log"
            COMMITS=$(git log --pretty=format:"- %s (%h)")
          fi

          {
            echo "## Installation"
            echo ""
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| Linux (all distros, including Arch) | \`.AppImage\`: portable, no installation required |"
            echo "| Linux Debian/Ubuntu | \`.deb\` |"
            echo "| Windows | \`.exe\` (NSIS installer) |"
            echo "| macOS, Apple Silicon (beta, unsigned) | \`.dmg\`, attached only when the macOS build succeeded |"
            echo ""
            echo "> The \`.AppImage\` is patched to work on Arch / Mesa 24+ (no \`EGL_BAD_PARAMETER\` crash)."
            echo ""
            echo "### macOS beta (unsigned)"
            echo "The macOS build is a beta. It is not signed with an Apple Developer ID and not notarized, so macOS blocks it the first time. To open it:"
            echo ""
            echo "1. Open the \`.dmg\` and drag ComdTeX to Applications."
            echo "2. Open ComdTeX once. macOS says it cannot verify the app; click **Done** (not Move to Bin)."
            echo "3. Open **System Settings > Privacy & Security**, scroll to **Security** and click **Open Anyway** next to ComdTeX, then confirm and enter your password."
            echo ""
            echo "On macOS Sequoia (15) and later the old right-click > Open shortcut no longer bypasses this; the Open Anyway button is the way. On older versions, right-click the app and choose Open. Only Apple Silicon (M1 or later) is built."
            echo ""
            echo "### Updates"
            echo "ComdTeX checks for a new version on startup and installs it from inside the app: the AppImage and the Windows installer update in place, the \`.deb\` asks for your password to install. Every update is signature-checked."
            echo ""
            echo "### Optional dependencies"
            echo "- \`pandoc\`: DOCX, Beamer and Typst export, and document import"
            echo "- \`zip\`: vault backup"
            echo ""
            echo "## Changes"
            echo ""
            echo "$COMMITS"
          } > RELEASE_NOTES.md

          {
            echo "body<<EOF"
            cat RELEASE_NOTES.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build release (draft)
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ComdTeX ${{ github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          # The publish job writes latest.json once every signature is uploaded;
          # two matrix jobs editing it at the same time could drop a platform.
          includeUpdaterJson: false
          # Signed updater artifacts only in release builds, so a local build
          # never needs the private key.
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json

      - name: Check the ad-hoc signature (macOS beta)
        if: matrix.os == 'macos-latest'
        run: |
          APP=$(find src-tauri/target -type d -name "*.app" -path "*release/bundle/macos/*" | head -1)
          echo "App bundle: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier|flags" || true

      - name: Upload macOS artifacts (beta)
        if: matrix.os == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE_DIR=$(find src-tauri/target -type d -path "*release/bundle" | head -1)
          ARCHIVE=$(find "$BUNDLE_DIR/macos" -name "*.app.tar.gz" | head -1)
          test -s "$ARCHIVE"
          test -s "${ARCHIVE}.sig"
          # A name of our own, so the archive and its signature share a stem and the
          # manifest generator can pair them.
          mkdir -p macos-out
          cp "$ARCHIVE" "macos-out/ComdTeX_${VERSION}_aarch64.app.tar.gz"
          cp "${ARCHIVE}.sig" "macos-out/ComdTeX_${VERSION}_aarch64.app.tar.gz.sig"
          DMG=$(find "$BUNDLE_DIR/dmg" -name "*.dmg" | head -1)
          cp "$DMG" macos-out/
          cd macos-out
          for f in *.dmg *.app.tar.gz; do shasum -a 256 "$f" > "$f.sha256"; done
          # Upload the archive before its signature: latest.json needs both.
          gh release upload "${{ github.ref_name }}" *.dmg *.app.tar.gz *.sha256 \
            --clobber --repo "${{ github.repository }}"
          gh release upload "${{ github.ref_name }}" *.app.tar.gz.sig \
            --clobber --repo "${{ github.repository }}"

      - name: Patch AppImage for EGL compatibility
        if: matrix.os == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          APPIMAGE=$(find src-tauri/target -name "*.AppImage" | grep -v ".zsync" | head -1)

          # Extract AppImage without FUSE.
          # AppImage Type 2: squashfs starts right after the ELF runtime.
          # Offset = e_shoff + e_shentsize * e_shnum (ELF64 section header table end).
          OFFSET=$(python3 -c "import struct; f=open('$APPIMAGE','rb'); f.seek(40); shoff=struct.unpack('<Q',f.read(8))[0]; f.seek(58); shentsz,shnum=struct.unpack('<HH',f.read(4)); print(shoff+shentsz*shnum)")
          echo "squashfs offset: $OFFSET"
          unsquashfs -o "$OFFSET" -d squashfs-root "$APPIMAGE"

          # Remove bundled libwayland-egl: incompatible with Mesa 24+.
          rm -f squashfs-root/usr/lib/libwayland-egl.so.1

          # Remove forced GDK_BACKEND=x11 and add WEBKIT_DISABLE_DMABUF_RENDERER.
          sed -i '/export GDK_BACKEND=x11/d' squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh
          echo 'export WEBKIT_DISABLE_DMABUF_RENDERER=1' >> squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh

          # Repack (--appimage-extract-and-run bypasses FUSE on GitHub runners)
          wget -q -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$APPIMAGE"
          rm -rf squashfs-root appimagetool

          # Re-sign patched AppImage for auto-updater
          npx tauri signer sign "$APPIMAGE" \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

          # The bundler signed the .deb (tauri.release.conf.json); it updates in place too.
          DEB=$(find src-tauri/target -name "*.deb" | head -1)

          # Replace the AppImage and upload both signatures to the draft release
          gh release upload "${{ github.ref_name }}" "$APPIMAGE" "${APPIMAGE}.sig" "${DEB}.sig" \
            --clobber \
            --repo "${{ github.repository }}"

      - name: Generate SHA256 checksums (Linux)
        if: matrix.os == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p checksums
          cd checksums
          # Find all bundle artifacts (AppImage, deb) but skip sig/zsync/sha256 sidecars.
          find ../src-tauri/target/*/release/bundle/ -type f \
            \( -name "*.AppImage" -o -name "*.deb" \) | while read -r f; do
            BASENAME=$(basename "$f")
            (cd "$(dirname "$f")" && sha256sum "$BASENAME") > "${BASENAME}.sha256"
            echo "Wrote ${BASENAME}.sha256"
            cat "${BASENAME}.sha256"
          done
          if ls *.sha256 >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" *.sha256 \
              --clobber --repo "${{ github.repository }}"
          else
            echo "::warning::No bundle artifacts found for checksum generation"
          fi

      - name: Generate SHA256 checksums (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path checksums | Out-Null
          Set-Location checksums
          $files = Get-ChildItem -Path ../src-tauri/target/*/release/bundle/ -Recurse -Include *.exe, *.msi
          # The installer's updater signature, written by the bundler.
          $sigs = Get-ChildItem -Path ../src-tauri/target/*/release/bundle/ -Recurse -Include *.exe.sig
          if ($sigs.Count -eq 0) { Write-Host "::error::No updater signature for the Windows installer"; exit 1 }
          gh release upload "${{ github.ref_name }}" $sigs.FullName `
            --clobber --repo "${{ github.repository }}"
          foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLower()
            $line = "$hash  $($f.Name)"
            $outFile = "$($f.Name).sha256"
            Set-Content -Path $outFile -Value $line -NoNewline
            Write-Host "Wrote $outFile"
            Write-Host $line
          }
          $shaFiles = Get-ChildItem -Filter *.sha256
          if ($shaFiles.Count -gt 0) {
            gh release upload "${{ github.ref_name }}" $shaFiles.Name `
              --clobber --repo "${{ github.repository }}"
          } else {
            Write-Host "::warning::No bundle artifacts found for checksum generation"
          }

  publish:
    needs: [build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Write the updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir sigs
          gh release download "${{ github.ref_name }}" -p "*.sig" -D sigs \
            --repo "${{ github.repository }}"
          # Optional platforms (the macOS beta) are listed only when both their
          # archive and signature are among the release assets.
          gh release view "${{ github.ref_name }}" --json assets -q '.assets[].name' \
            --repo "${{ github.repository }}" > sigs/assets.txt
          node scripts/updater-manifest.mjs "${{ github.ref_name }}" "${{ github.repository }}" sigs sigs/assets.txt
          gh release upload "${{ github.ref_name }}" latest.json \
            --clobber --repo "${{ github.repository }}"

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --draft=false \
            --repo "${{ github.repository }}"

  # Updates the AUR package (comdtex-bin) once the release is public. It is a
  # no-op until the AUR_SSH_PRIVATE_KEY repository secret exists (see
  # packaging/README.md), and a failure here never fails the release itself.
  aur:
    name: Update AUR package
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    env:
      HAS_AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Skip when the AUR key is not configured
        if: env.HAS_AUR_KEY != 'true'
        run: echo "AUR_SSH_PRIVATE_KEY is not set; skipping the AUR update."

      - uses: actions/checkout@v4
        if: env.HAS_AUR_KEY == 'true'

      - name: Regenerate the AUR files
        if: env.HAS_AUR_KEY == 'true'
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$TAG is not a stable x.y.z tag; skipping the AUR update."
            echo "SKIP_AUR=true" >> "$GITHUB_ENV"
            exit 0
          fi
          ./packaging/aur/update.sh "$TAG"

      - name: Push to the AUR
        if: env.HAS_AUR_KEY == 'true' && env.SKIP_AUR != 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Pin the AUR ed25519 host key by its published fingerprint.
          ssh-keyscan -t ed25519 aur.archlinux.org > ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -lf ~/.ssh/known_hosts | grep -q 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4' \
            || { echo "::error::Unexpected AUR host key"; exit 1; }
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          git clone ssh://aur@aur.archlinux.org/comdtex-bin.git aur-repo
          cp packaging/aur/comdtex-bin/PKGBUILD packaging/aur/comdtex-bin/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name "ComdTeX release bot"
          git config user.email "noreply@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package is already up to date."
            exit 0
          fi
          git commit -m "Update to ${TAG#v}"
          git push origin HEAD:master
